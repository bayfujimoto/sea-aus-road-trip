:root{
  --paper:#F4F1E4; --panel:#F7F4EA; --grid:rgba(43,75,155,.10);
  --ink:#2B4B9B; --ink2:#5A72B5; --faint:rgba(43,75,155,.28);
  --pink:#E5309B; --orange:#EE7414; --green:#178F52;
  --mono:"CommitMono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:14.5px;line-height:1.5;
  background-image:repeating-linear-gradient(transparent 0 19px,var(--grid) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,var(--grid) 19px 20px);
  padding:env(safe-area-inset-top) 0 0 0;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
a{color:var(--ink)}
.app{max-width:520px;margin:0 auto;padding:12px 14px 90px}
.masthead{padding:8px 2px 12px;border-bottom:2px solid var(--ink)}
.masthead .mrow{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--ink2)}
.masthead h1{font-size:23px;font-weight:700;letter-spacing:.05em;line-height:1.1;margin-top:5px}
.masthead h1 span{color:var(--orange)}
.masthead .sub{font-size:11px;color:var(--ink2);margin-top:4px;letter-spacing:.1em}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:2px solid var(--ink);
  display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:40}
.tabbar button{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;color:var(--ink2);padding:7px 18px}
.tabbar button.on{color:var(--paper);background:var(--ink)}
.mapwrap{background:var(--panel);border:1px solid var(--ink);padding:10px;margin:14px 0}
.mapwrap svg{width:100%;height:auto;display:block}
.stopdot{cursor:pointer}
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--ink);padding:12px}
.tile.wide{grid-column:1 / -1}
.tile .k{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--ink2)}
.tile .v{font-size:13.5px;margin-top:5px}
.tile .big{font-size:22px;font-weight:700;margin-top:2px;color:var(--orange)}
.alertchip{display:inline-block;font-size:11px;font-weight:700;background:var(--pink);color:var(--paper);padding:2px 8px;margin-top:6px;letter-spacing:.06em}
.daypick{display:flex;gap:0;overflow-x:auto;padding:14px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.daypick::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;background:var(--paper);border:1px solid var(--ink);border-left-width:0;padding:8px 12px;text-align:left;min-width:94px}
.dchip:first-child{border-left-width:1px}
.dchip .dn{font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.dchip .dt{font-size:10.5px;color:var(--ink2);margin-top:2px}
.dchip.on{background:var(--ink)}
.dchip.on .dn{color:var(--paper)}
.dchip.on .dt{color:#C6D0EC}
.dchip.past .dn::after{content:" ✓";color:var(--green)}
.dchip.on.past .dn::after{color:#8FE2B4}
.dayhead{margin:6px 2px 4px}
.dayhead h2{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.dayhead .meta{font-size:11.5px;color:var(--ink2);margin-top:3px;letter-spacing:.04em}
.dayhead .meta b{color:var(--orange)}
.collapsecard{background:var(--panel);border:1px solid var(--green);padding:14px;margin:12px 0}
.collapsecard .done{font-weight:700;text-transform:uppercase;color:var(--green);letter-spacing:.1em;font-size:12.5px}
.collapsecard p{color:var(--ink2);font-size:13px;margin:6px 0 10px}
.ghostbtn{border:1px solid var(--ink);padding:7px 12px;font-size:13px;color:var(--ink)}
.brief{background:var(--panel);border:1px solid var(--ink);padding:12px 14px;margin:12px 0 4px}
.bh{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--ink);display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px dashed var(--ink);padding-bottom:6px}
.bl{font-size:12.5px;color:var(--ink);line-height:1.65;margin-top:9px;padding-left:52px;position:relative}
.bl i{position:absolute;left:0;top:1px;font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--pink)}
.tl{position:relative;margin:10px 0 0;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--ink)}
.leg{position:relative;padding:13px 0 13px 8px;font-size:11.5px;color:var(--ink2);letter-spacing:.04em}
.leg::after{content:"";position:absolute;left:-18px;top:5px;bottom:5px;width:4px;
  background:repeating-linear-gradient(var(--paper) 0 6px,var(--orange) 6px 13px)}
.leg .editleg{color:var(--faint);margin-left:8px;font-size:10.5px}
.ev{position:relative;background:var(--panel);border:1px solid var(--ink);padding:11px 12px;margin:4px 0}
.ev::before{content:"";position:absolute;left:-21px;top:18px;width:9px;height:9px;
  background:var(--paper);border:2px solid var(--ink)}
.ev.done{opacity:.55}
.ev.done::before{background:var(--green);border-color:var(--green)}
.ev.done .t{text-decoration:line-through}
.ev.warned{border-color:var(--pink)}
.ev.warned::before{border-color:var(--pink)}
.evtop{display:flex;align-items:baseline;gap:9px}
.evtop .tm{font-size:11.5px;font-weight:700;color:var(--ink);min-width:46px}
.evtop .t{font-size:13.5px;font-weight:700;flex:1}
.evtop .pr{font-size:11.5px;font-weight:700;color:var(--orange)}
.evtop .ic{font-size:9.5px;font-weight:700;color:var(--ink2);border:1px solid var(--ink2);padding:0 4px;letter-spacing:.06em}
.evsum{color:var(--ink2);font-size:12.5px;margin:4px 0 0 55px;line-height:1.55}
.bstat{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;margin-left:55px;margin-top:6px;letter-spacing:.08em}
.bstat.asap{background:var(--pink);color:var(--paper)}
.bstat.soon{background:var(--orange);color:var(--paper)}
.bstat.booked{background:var(--green);color:var(--paper)}
.bstat.walkin{border:1px solid var(--ink2);color:var(--ink2)}
.evx{margin-top:10px;border-top:1px dashed var(--ink);padding-top:10px;font-size:13px}
.evx .row{margin:7px 0}
.evx .lbl{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--pink)}
.evx .warnbox{border:1px solid var(--pink);padding:8px 10px;color:var(--pink);font-size:12.5px;margin:8px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--ink);padding:8px 13px;font-size:13px}
.btn.gold{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.btn.red{color:var(--pink);border-color:var(--pink)}
.donebtn{border:1px solid var(--green);color:var(--green);padding:8px 13px;font-size:13px}
.donebtn.is{background:var(--green);color:var(--paper);font-weight:700}
/* minor events: fuel + leg stretches */
.ev.minor{background:transparent;border:none;padding:3px 0 3px 8px;margin:1px 0}
.ev.minor::before{width:6px;height:6px;top:9px;left:-19px;border-width:1.5px;border-color:var(--ink2)}
.ev.minor .tm{font-size:10.5px;color:var(--ink2);font-weight:400;min-width:42px}
.ev.minor .t{font-size:11.5px;font-weight:400;color:var(--ink2)}
.ev.minor .pr{font-size:10.5px;color:var(--orange);opacity:.85}
.ev.minor .ic{font-size:8.5px;border-color:var(--faint);color:var(--ink2);opacity:.8}
.ev.minor.warned::before{border-color:var(--pink);background:var(--pink)}
.ev.minor.warned .t{color:var(--pink);font-weight:700}
.ev.minor.done::before{background:var(--green);border-color:var(--green)}
.ev.minor.open{background:var(--panel);border:1px solid var(--ink2);padding:9px 10px;margin:4px 0}
.ev.minor .evsum{margin-left:51px;font-size:11.5px}
.ev.minor .bstat{margin-left:51px}
.eform .row{margin:8px 0}
.eform label{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--ink2);margin-bottom:3px}
.half{display:flex;gap:8px}.half>div{flex:1}
.addrow{display:flex;gap:8px;margin:14px 0 4px}
.refsec{background:var(--panel);border:1px solid var(--ink);padding:13px;margin:12px 0}
.refsec h3{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--ink);margin-bottom:8px;border-bottom:1px dashed var(--ink);padding-bottom:5px}
.refsec li{margin:6px 0 6px 18px;font-size:12.5px}
.checkli{list-style:none;margin-left:0 !important;display:flex;gap:9px;align-items:flex-start}
.checkli input{width:auto;margin-top:3px;accent-color:var(--green)}
.budtable{width:100%;font-size:12px;border-collapse:collapse}
.budtable td{padding:5px 4px;border-bottom:1px solid var(--faint)}
.budtable td:last-child{text-align:right;font-weight:700;color:var(--orange)}
.budtable tr.tot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:700;color:var(--ink)}
.note{font-size:11.5px;color:var(--ink2);margin-top:8px}
.storagewarn{background:var(--pink);color:var(--paper);padding:9px 12px;font-size:12.5px;margin:10px 0;font-weight:700;display:none}
</style>
</head>

<script>
/* ---------- data ---------- */
const VERSION=7;
function ev(time,type,title,o={}){return Object.assign({kind:"ev",id:uid(),time,type,title,price:0,sum:"",loc:"",mapq:"",det:"",warn:"",book:"",done:false,at:""},o)}
function leg(miles,hours,txt=""){return {kind:"leg",id:uid(),miles,hours,txt}}
function uid(){return Math.random().toString(36).slice(2,9)}

{date:"2026-08-14",brief:{geo:"The Little Missouri badlands: soft Paleocene river sediments (Fort Union formation) dissected into banded buttes. The red layers are scoria — clay baked brick-hard by lignite coal seams that caught fire and smoldered underground for years. Petrified stumps litter the South Unit.",life:"Bison herds in both units, feral horses in the South, longhorns in the North, prairie dogs everywhere, golden eagles overhead. Rattlesnakes exist; stay on paths at overlooks.",hist:"Roosevelt arrived in 1883 to shoot a buffalo, came back in 1884 shattered by the deaths of his wife and mother on the same Valentine's Day, and ranched here until the killing winter of 1886–87. 'I never would have been President,' he wrote, 'if it had not been for my experiences in North Dakota.' The Marquis de Morès' Medora is the town that outlived his schemes.",wx:"Low 90s and dry; big-sky storm cells possible late afternoon."},dow:"FRI",n:5,title:"Both TR Units → Dickinson",tz:"MT",miles:290,hours:"5 + 2 park drives",items:[

{date:"2026-08-15",brief:{geo:"Devils Tower is a phonolite intrusion — magma that stalled underground, cooled into massive columns, and was exhumed as the softer red Spearfish shale eroded away. That red bedrock rings the whole Black Hills like a racetrack. Spearfish Canyon's limestone walls are a Paleozoic seafloor.",life:"A prairie dog metropolis sprawls at the Tower's base; wild turkeys work the pine draws. In the canyon: white-throated swifts on the walls and American dippers bobbing in the creek.",hist:"To the Lakota, Kiowa, and some twenty nations this is Bear Lodge — the fluting is a giant bear's claw marks in the sacred stories. Prayer cloths in the trees are active worship, not decoration. Teddy Roosevelt made it the first national monument in 1906; Spielberg made it a landing pad in 1977.",wx:"Upper 80s; afternoon build-ups over the Hills."},dow:"SAT",n:6,title:"Devils Tower → Rapid City",tz:"MT",miles:330,hours:"5.5",items:[

{date:"2026-08-16",brief:{geo:"The Needles are the exposed core of the Black Hills — Harney Peak granite, ~1.7 billion years old, intruded into even older metamorphics; the glittering flakes in the roadcuts are pegmatite mica. The Hills are a geologic bullseye: oldest rock in the center, younger rings outward. Wind Cave's boxwork formed as fin-like calcite veins outlasted the dissolving limestone around them.",life:"Custer's 1,400-head bison herd, pronghorn, bighorn, and the famous begging burros (descendants of pack animals — don't feed them, they're professionals). The cave stays 54°F year-round.",hist:"Custer's 1874 expedition found gold here, and the 1868 Fort Laramie Treaty died with the strike; in 1980 the Supreme Court ruled the taking illegal, and the Lakota have refused the money ever since — it sits accruing interest. Borglum carved presidents from 1927; Ziolkowski answered with Crazy Horse from 1948, still going.",wx:"Pleasant in the pines, hot in the open; cave requires a layer."},dow:"SUN",n:7,title:"Black Hills circuit + Wind Cave",tz:"MT",miles:160,hours:"3.5–4 in hops",items:[

{date:"2026-08-17",brief:{geo:"The wall of the Badlands records 47 million years: black Pierre Shale (an inland sea floor) at the base, then the banded Chadron and Brule — rivers, floodplains, ash falls — all eroding an inch a year. This is one of the richest Oligocene mammal beds on Earth: three-toed horses, brontotheres, saber-cats.",life:"Bighorn sheep on the ledges at dawn, burrowing owls in the dog towns — and the dog towns host black-footed ferrets, the continent's rarest mammal, brought back from 18 individuals (nocturnal; you won't see one, but you'll drive past them).",hist:"Mako sica — 'bad land' — to the Lakota, whose Ghost Dancers took refuge on the Stronghold in 1890, weeks before Wounded Knee, 40 miles south. The missile silo at exit 131 kept a different apocalypse on ten-minute alert for thirty years.",wx:"Cool at sunrise, cooking by 10 — another argument for the dawn flip. Wind, always."},dow:"MON",n:8,title:"Badlands at sunrise · rest afternoon",tz:"MT",miles:170,hours:"3",items:[

{date:"2026-08-18",brief:{geo:"Today is McPhee's 'rise from the plains' made physical: the High Plains ramp climbs imperceptibly from 3,200 to 7,500 feet — you gain a Black Hills' worth of elevation without noticing — until the Laramie Range and then the Front Range stand up out of the grass.",life:"Pronghorn all day, ferruginous hawks on the poles, and past Fort Collins the first mule deer of the foothills. Estes' elk herd wanders town like it pays taxes.",hist:"Near Torrington you cross the Oregon–California–Mormon trail corridor along the North Platte — Fort Laramie, the great treaty ground of 1851 and 1868, sits just off route. Cheyenne was the cattle barons' capital; its opera-house money built the 'Holy City of the Cow.'",wx:"Hot plains, cooler every hour after Fort Collins; hydrate hard today — altitude prep starts now."},dow:"TUE",n:9,title:"Rapid City → Estes Park",tz:"MT",miles:345,hours:"5.5",items:[

{date:"2026-08-19",brief:{geo:"Trail Ridge climbs through three life zones in 45 minutes — montane, subalpine, alpine — ecologically the same as driving to the Arctic Circle. The tundra up top is an ice-age relict; the gnarled krummholz at treeline may be 400 years old at knee height. Then South Park: a 10,000-foot grass sea ringed by ranges.",life:"Elk in Horseshoe Park at dawn (the September rut is warming up), pikas farming hay piles in the talus, marmots sunning, white-tailed ptarmigan doing their invisible-rock act. Tundra plants bloom for six weeks a year; stay on the trail — a bootprint lasts decades.",hist:"The road follows a Ute and Arapaho crossing route ('the Dog's Trail'); CCC crews built the modern version by 1932 — highest continuous paved road in the country. The San Luis Valley ahead holds Colorado's oldest water rights and its oldest town.",wx:"~40°F at the top at dawn, wind chill lower; monsoon cells build by late morning — the noon rule is non-negotiable. Alamosa evening: 70s and calm."},dow:"WED",n:10,title:"Rocky Mountain → Alamosa",tz:"MT",miles:255,hours:"5",items:[

/* ---------- storage ---------- */
let MEM=null, canStore=true;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){canStore=false}
function load(){
  if(canStore){try{const raw=localStorage.getItem("atlas");if(raw){const d=JSON.parse(raw);if(d.v===VERSION)return d}}catch(e){}}
  return MEM||defaultData();
}
function save(d){MEM=d;if(canStore){try{localStorage.setItem("atlas",JSON.stringify(d))}catch(e){}}}
let DATA=load();
if(!canStore)document.getElementById("storagewarn").style.display="block";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayDone(d){const evs=d.items.filter(i=>i.kind==="ev");return evs.length>0&&evs.every(e=>e.done)}
function dayPast(d){return d.date<todayISO()}
function dayTotal(d){return d.items.filter(i=>i.kind==="ev").reduce((a,e)=>a+(Number(e.price)||0),0)}
function mapsLink(q){return "https://maps.apple.com/?q="+encodeURIComponent(q)}
/* ---------- state ---------- */
let TAB="route", SEL=null, OPEN={}, EDIT=null, FORCE={}, BRIEF={};
function pickDefaultDay(){const t=todayISO();let i=DATA.days.findIndex(d=>d.date>=t);if(i<0)i=DATA.days.length-1;return i}
/* ---------- render ---------- */
function go(t){TAB=t;render()}
function render(){
  ["route","days","kit"].forEach(t=>$("#tab-"+t).classList.toggle("on",t===TAB));
  if(TAB==="route")renderRoute();else if(TAB==="days")renderDays();else renderKit();
}
function renderRoute(){
  const pts=[[30,42],[105,55],[152,44],[176,50],[228,56],[272,64],[264,110],[214,168],[209,204],[228,254],[233,262],[318,286]];
  const names=DATA.days.map(d=>d.title);
  let path="M"+pts.map(p=>p.join(",")).join(" L");
  const t=todayISO();const ti=DATA.days.findIndex(d=>d.date===t);
  let dots=pts.map((p,i)=>{
    const past=DATA.days[i]&&dayPast(DATA.days[i]);
    const cur=i===ti;
    const s=cur?20:16;
    return `<g class="stopdot" onclick="jumpDay(${i})">
      <rect x="${p[0]-s/2}" y="${p[1]-s/2}" width="${s}" height="${s}" fill="${past?"#178F52":cur?"#EE7414":"#F4F1E4"}" stroke="${cur?"#EE7414":"#2B4B9B"}" stroke-width="2"/>
      <text x="${p[0]}" y="${p[1]+3.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${past||cur?"#F4F1E4":"#2B4B9B"}" font-family="CommitMono,monospace">${i+1}</text></g>`}).join("");
  const nextBook=DATA.days.flatMap(d=>d.items).find(e=>e.kind==="ev"&&e.book==="asap");
  const rem=DATA.days.filter(d=>!dayPast(d)).reduce((a,d)=>a+(Number(d.miles)||0),0);
  const doneCt=DATA.days.filter(d=>dayPast(d)||dayDone(d)).length;
  const sel=ti>=0?ti:pickDefaultDay();const today=DATA.days[sel];
  $("#view").innerHTML=`
  <div class="mapwrap"><svg viewBox="0 0 350 305" role="img" aria-label="Route map, Seattle to Austin">
    <text x="14" y="20" font-size="9.5" fill="#5A72B5" font-family="CommitMono,monospace" letter-spacing="1">FIG. 0 — WA·MT·ND·SD·WY·CO·NM·TX</text>
    <path d="${path}" fill="none" stroke="#2B4B9B" stroke-opacity=".22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="#2B4B9B" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="30" y="26" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2B4B9B" font-family="CommitMono,monospace">SEATTLE</text>
    <text x="318" y="303" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2B4B9B" font-family="CommitMono,monospace">AUSTIN</text>
  </svg><div class="note">Tap a numbered stop to open its day. Green = behind you, orange = today.</div></div>
  <div class="tilegrid">
    <div class="tile wide"><div class="k">${ti>=0?"Today — Day "+(ti+1):"Next up — Day "+(sel+1)}</div>
      <div class="v"><b>${esc(today.title)}</b><br><span style="color:var(--sage)">${today.miles} mi · ${esc(today.hours)} hrs · ${esc(today.tz)}</span></div>
      <div style="margin-top:8px"><button class="btn gold" onclick="jumpDay(${sel})">Open day</button></div></div>
    <div class="tile"><div class="k">Progress</div><div class="big">${doneCt} / 12</div><div class="v" style="color:var(--sage)">${rem.toLocaleString()} mi to go</div></div>
    <div class="tile"><div class="k">Bookings</div>${nextBook?`<div class="v">${esc(nextBook.title)}</div><span class="alertchip">BOOK ASAP</span>`:`<div class="v" style="color:var(--ok)">All urgent items booked ✓</div>`}</div>
  </div>`;
}
function jumpDay(i){SEL=i;TAB="days";render();window.scrollTo(0,0)}
function renderDays(){
  if(SEL===null)SEL=pickDefaultDay();
  const chips=DATA.days.map((d,i)=>`<button class="dchip ${i===SEL?"on":""} ${dayPast(d)||dayDone(d)?"past":""}" onclick="jumpDay(${i})">
    <div class="dn">Day ${i+1}</div><div class="dt">${d.dow} ${d.date.slice(5).replace("-","/")}</div></button>`).join("");
  const d=DATA.days[SEL];
  const completed=(dayPast(d)||dayDone(d))&&!FORCE[SEL];
  let body;
  if(completed){
    body=`<div class="collapsecard"><div class="done">Day complete ✓</div>
      <p>${esc(d.title)} — ${d.miles} mi · ${esc(d.hours)} hrs · spent ~$${dayTotal(d)}</p>
      <button class="ghostbtn" onclick="FORCE[${SEL}]=true;render()">Show details</button></div>`;
  }else{
    body=`<div class="tl">`+d.items.map(it=>it.kind==="leg"?legHTML(it):evHTML(it)).join("")+`</div>
    <div class="addrow"><button class="btn" onclick="addItem('ev')">+ Event</button><button class="btn" onclick="addItem('leg')">+ Driving stretch</button>
    ${(dayPast(d)||dayDone(d))?`<button class="ghostbtn" onclick="delete FORCE[${SEL}];render()">Collapse</button>`:""}</div>`;
  }
  const bf=d.brief&&!completed?`<div class="brief"><div class="bh" onclick="toggleBrief(${SEL})">FIG. 1 — FIELD BRIEFING <span>${BRIEF[SEL]===false?"▸":"▾"}</span></div>${BRIEF[SEL]===false?"":`
    <div class="bl"><i>Land</i>${esc(d.brief.geo)}</div>
    <div class="bl"><i>Life</i>${esc(d.brief.life)}</div>
    <div class="bl"><i>Story</i>${esc(d.brief.hist)}</div>
    <div class="bl"><i>Sky</i>${esc(d.brief.wx)}</div>`}</div>`:"";
  $("#view").innerHTML=`<div class="daypick">${chips}</div>
    <div class="dayhead"><h2>Day ${SEL+1} · ${esc(d.title)}</h2>
    <div class="meta"><b>${d.miles} mi</b> · ${esc(d.hours)} hrs driving · ${esc(d.tz)} · day total ~$${dayTotal(d)}</div></div>${bf}${body}`;
}
function legHTML(it){
  if(EDIT===it.id)return legForm(it);
  return `<div class="leg" onclick="startEdit('${it.id}')">▾ &nbsp;${esc(it.miles)} mi · ${esc(it.hours)} hr${it.txt?" — "+esc(it.txt):""}<span class="editleg">edit</span></div>`;
}
function evHTML(e){
  if(EDIT===e.id)return evForm(e);
  const open=OPEN[e.id];
  const bs=e.book?`<span class="bstat ${e.book}">${{asap:"BOOK ASAP",soon:"BOOK SOON",booked:"BOOKED ✓",walkin:"WALK-IN"}[e.book]}</span>`:"";
  let x="";
  if(open){
    x=`<div class="evx">
      ${e.det?`<div class="row">${esc(e.det)}</div>`:""}
      ${e.warn?`<div class="warnbox">⚠ ${esc(e.warn)}</div>`:""}
      ${e.loc?`<div class="row"><span class="lbl">Where</span><br>${esc(e.loc)}</div>`:""}
      <div class="row"><span class="lbl">Price</span><br>$${Number(e.price)||0}</div>
      <div class="btnrow">
        ${e.mapq?`<a class="btn" href="${mapsLink(e.mapq)}" target="_blank" rel="noopener">Open in Apple Maps</a>`:""}
        ${e.at?`<a class="btn" href="${esc(e.at)}" target="_blank" rel="noopener">AllTrails</a>`:""}
        <button class="donebtn ${e.done?"is":""}" onclick="event.stopPropagation();toggleDone('${e.id}')">${e.done?"Done ✓":"Mark done"}</button>
        <button class="btn" onclick="event.stopPropagation();startEdit('${e.id}')">Edit</button>
      </div></div>`;
  }
  const minor=(e.type==="fuel"||e.type==="stretch");
  return `<div class="ev ${minor?"minor":""} ${open?"open":""} ${e.done?"done":""} ${e.warn?"warned":""}" onclick="toggleOpen('${e.id}')">
    <div class="evtop"><span class="tm">${esc(e.time)}</span><span class="ic">${ICONS[e.type]||"◆"}</span><span class="t">${esc(e.title)}</span><span class="pr">${e.price?"$"+e.price:""}</span></div>
    ${e.sum&&(open||!minor)?`<div class="evsum">${esc(e.sum)}</div>`:""}
    ${bs}${x}</div>`;
}
/* ---------- edit ---------- */
function findItem(id){for(const d of DATA.days){const i=d.items.find(x=>x.id===id);if(i)return{day:d,item:i}}return null}
function toggleOpen(id){OPEN[id]=!OPEN[id];render()}
function toggleDone(id){const f=findItem(id);f.item.done=!f.item.done;save(DATA);render()}
function startEdit(id){EDIT=id;render()}
function evForm(e){
  const opt=(v,l)=>`<option value="${v}" ${e.type===v?"selected":""}>${l}</option>`;
  const bopt=(v,l)=>`<option value="${v}" ${e.book===v?"selected":""}>${l}</option>`;
  return `<div class="ev"><form class="eform" onsubmit="return saveEv(event,'${e.id}')">
    <div class="half"><div class="row"><label>Time</label><input name="time" value="${esc(e.time)}"></div>
    <div class="row"><label>Price $</label><input name="price" type="number" step="1" inputmode="numeric" value="${Number(e.price)||0}"></div></div>
    <div class="row"><label>Title</label><input name="title" value="${esc(e.title)}" required></div>
    <div class="half"><div class="row"><label>Type</label><select name="type">${opt("sight","Sight")}${opt("hike","Hike")}${opt("meal","Meal")}${opt("lodging","Lodging")}${opt("stamp","Stamp")}${opt("fuel","Fuel")}${opt("stretch","Leg stretch")}${opt("note","Note")}</select></div>
    <div class="row"><label>Booking</label><select name="book"><option value="">—</option>${bopt("asap","Book ASAP")}${bopt("soon","Book soon")}${bopt("booked","Booked")}${bopt("walkin","Walk-in")}</select></div></div>
    <div class="row"><label>Summary</label><input name="sum" value="${esc(e.sum)}"></div>
    <div class="row"><label>Details</label><textarea name="det">${esc(e.det)}</textarea></div>
    <div class="row"><label>Warning</label><input name="warn" value="${esc(e.warn)}"></div>
    <div class="row"><label>Location label</label><input name="loc" value="${esc(e.loc)}"></div>
    <div class="row"><label>Apple Maps search</label><input name="mapq" value="${esc(e.mapq)}" placeholder="e.g. Quality Inn Estes Park CO"></div>
    <div class="row"><label>AllTrails URL</label><input name="at" value="${esc(e.at||"")}" placeholder="https://www.alltrails.com/trail/..."></div>
    <div class="btnrow"><button class="btn gold" type="submit">Save</button>
      <button class="btn" type="button" onclick="EDIT=null;render()">Cancel</button>
      <button class="btn" type="button" onclick="moveItem('${e.id}',-1)">↑</button>
      <button class="btn" type="button" onclick="moveItem('${e.id}',1)">↓</button>
      <button class="btn red" type="button" onclick="delItem('${e.id}')">Delete</button></div>
  </form></div>`;
}
function legForm(it){
  return `<div class="ev"><form class="eform" onsubmit="return saveLeg(event,'${it.id}')">
    <div class="half"><div class="row"><label>Miles</label><input name="miles" value="${esc(it.miles)}"></div>
    <div class="row"><label>Hours</label><input name="hours" value="${esc(it.hours)}"></div></div>
    <div class="row"><label>Note</label><input name="txt" value="${esc(it.txt)}"></div>
    <div class="btnrow"><button class="btn gold" type="submit">Save</button>
      <button class="btn" type="button" onclick="EDIT=null;render()">Cancel</button>
      <button class="btn" type="button" onclick="moveItem('${it.id}',-1)">↑</button>
      <button class="btn" type="button" onclick="moveItem('${it.id}',1)">↓</button>
      <button class="btn red" type="button" onclick="delItem('${it.id}')">Delete</button></div>
  </form></div>`;
}
function saveEv(evn,id){evn.preventDefault();const f=evn.target.elements,x=findItem(id).item;
  ["time","title","sum","det","warn","loc","mapq","type","book","at"].forEach(k=>x[k]=f.namedItem(k).value);
  x.price=Number(f.namedItem("price").value)||0;EDIT=null;save(DATA);render();return false}
function saveLeg(evn,id){evn.preventDefault();const f=evn.target.elements,x=findItem(id).item;
  x.miles=f.namedItem("miles").value;x.hours=f.namedItem("hours").value;x.txt=f.namedItem("txt").value;EDIT=null;save(DATA);render();return false}
function delItem(id){if(!confirm("Delete this item?"))return;const d=DATA.days[SEL];d.items=d.items.filter(x=>x.id!==id);EDIT=null;save(DATA);render()}
function moveItem(id,dir){const d=DATA.days[SEL];const i=d.items.findIndex(x=>x.id===id);const j=i+dir;
  if(j<0||j>=d.items.length)return;[d.items[i],d.items[j]]=[d.items[j],d.items[i]];save(DATA);render()}
function addItem(kind){const d=DATA.days[SEL];
  const it=kind==="leg"?leg("0","0",""):ev("0:00","note","New event");
  d.items.push(it);EDIT=it.id;FORCE[SEL]=true;save(DATA);render();
  setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50)}
function toggleBrief(i){BRIEF[i]=BRIEF[i]===false?true:false;render()}
/* ---------- kit / reference ---------- */

    <tr class="tot"><td>Trip total</td><td>$${(evTotal+fixTotal).toLocaleString()}</td></tr>
    <tr><td>Spent so far (done items)</td><td>$${spent.toLocaleString()}</td></tr></table>
    <div class="note">Edit any event's price and this table follows.</div></div>
  <div class="refsec"><h3>Standing safety rules</h3><ul>${k.safety.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
  <div class="refsec"><h3>Pre-departure</h3><ul>${k.pre.map((p,i)=>`<li class="checkli"><input type="checkbox" ${p.d?"checked":""} onchange="togglePre(${i})"><span>${esc(p.t)}</span></li>`).join("")}</ul></div>
  <div class="refsec"><h3>Data</h3><div class="btnrow">
    <button class="btn" onclick="exportData()">Export backup</button>
    <button class="btn" onclick="document.getElementById('imp').click()">Import backup</button>
    <button class="btn red" onclick="resetData()">Reset to original plan</button></div>
    <input id="imp" type="file" accept=".json" style="display:none" onchange="importData(this)">
    <div class="note">Export twice during the trip. iOS can clear web storage under extreme storage pressure — the backup file in Files is your safety net.</div></div>`;
}
function markBooked(id){const f=findItem(id);f.item.book="booked";save(DATA);render()}
function togglePre(i){DATA.kit.pre[i].d=!DATA.kit.pre[i].d;save(DATA);render()}
function exportData(){const blob=new Blob([JSON.stringify(DATA)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="road-atlas-backup.json";a.click()}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.days){DATA=d;save(DATA);render()}else alert("Not a valid backup file.")}catch(e){alert("Couldn't read that file.")}};r.readAsText(f)}
function resetData(){if(!confirm("Discard ALL edits and restore the original plan?"))return;DATA=defaultData();save(DATA);render()}
/* ---------- sw ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
render();

</script>
</body>
</html>

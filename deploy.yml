# Road Atlas — deploy to GitHub Pages on every push to main.
# Put this file at: .github/workflows/deploy.yml
# Then: repo Settings → Pages → Source: "GitHub Actions"

name: Deploy Road Atlas

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # adds a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # index.html + sw.js live at the repo root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
